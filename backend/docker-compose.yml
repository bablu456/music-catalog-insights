version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: music_catalog_db
    environment:
      POSTGRES_DB: music_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
